name: Feature or engineering task
description: Plan a change with security, privacy, and verification criteria.
title: ""
labels:
  - feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy, authentication, and authorization impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
